openapi: 3.0.0
info:
  version: 1.0.0
  title: NSM Resource Allocation APIs
  description: |
    NSM resource allocation service.

    Two resources, one shape. An AMF pointer and an SMF's UE-IP segments are
    both an exclusive claim on part of a small finite space, held by an instance
    until it releases the claim or NSM decides the holder is gone. They are here
    together rather than beside the configuration they are used with, because a
    read and an allocation want opposite things: a read must be repeatable and
    free of side effects, an allocation must be exclusive.

    Every operation is idempotent under the caller's mesh endpoint uuid. The
    consumer retries indefinitely, so an operation that allocated afresh on
    every attempt would burn the space on a schedule; asking again returns what
    this uuid already holds.

    A claim is a lease. It expires unless the holder re-asserts it, which the
    holder does on the same tick that reads its configuration - so liveness is
    the holder saying it is alive rather than anyone else's opinion about
    whether it is reachable.

    © 2024, ETRI
    All rights reserved.
servers:
  - url: '{apiRoot}/nsm-alloc/v1'
    variables:
      apiRoot:
        default: https://example.com
        description: apiRoot as defined in clause 4.4 of 3GPP TS 29.501.

paths:
  /amf-pointer:
    put:
      operationId: AmfRegister

      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AmfRegistrationRequest'
        required: true

      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AmfRegistrationResponse'

        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: 'TS29571_CommonData.yaml#/components/schemas/ProblemDetails'

        '500':
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: 'TS29571_CommonData.yaml#/components/schemas/ProblemDetails'

  /ip-segments:
    put:
      operationId: AllocateIpSegments

      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IpSegmentRequest'
        required: true

      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IpSegmentResponse'

        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: 'TS29571_CommonData.yaml#/components/schemas/ProblemDetails'

        '500':
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: 'TS29571_CommonData.yaml#/components/schemas/ProblemDetails'

  /leases:
    put:
      operationId: RenewLeases

      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeaseRenewalRequest'
        required: true

      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaseRenewalResponse'

        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: 'TS29571_CommonData.yaml#/components/schemas/ProblemDetails'

        '500':
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: 'TS29571_CommonData.yaml#/components/schemas/ProblemDetails'

  /ip-segments/release:
    post:
      operationId: ReleaseIpSegments

      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IpSegmentReleaseRequest'
        required: true

      responses:
        '204':
          description: No Content

        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: 'TS29571_CommonData.yaml#/components/schemas/ProblemDetails'

        '500':
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: 'TS29571_CommonData.yaml#/components/schemas/ProblemDetails'

components:
  securitySchemes:
  schemas:
    AmfRegistrationRequest:
      description: AMF pointer claim
      type: object
      properties:
        uuid:
          type: string
        amfSet:
          type: string
        plmnId:
          $ref: 'TS29571_CommonData.yaml#/components/schemas/PlmnId'
      required:
        - uuid
        - amfSet
        - plmnId

    AmfRegistrationResponse:
      description: |
        The pointer this instance holds within its set, and the lease that holds
        it. The set's slices and the roaming peer list are configuration and
        arrive on the slicing topic, so an AMF can re-read them without
        re-running an allocation.
      type: object
      properties:
        amfPointer:
          type: integer
          format: int16
        lease:
          description: |
            What to re-assert on the renewal tick.

            It is handed back rather than derived so that the holder never
            composes one. The name encodes which space and which value, and a
            consumer that built it from the parts it happens to know would be two
            implementations of one encoding, drifting independently - the failure
            this whole interface avoids by naming things once, on the side that
            owns them.
          $ref: '#/components/schemas/Lease'
      required:
        - amfPointer

    IpSegmentKey:
      description: |
        Which address space a segment is drawn from. The four fields are the
        whole identity: the network instance is the routing domain that makes
        addresses unique, the DNAI is the point of access the prefixes are
        routed to, and ipIndex separates ranges a subscription may select
        between within one instance and family.

        dnn is carried as well, but as a label rather than as part of the
        identity: one data network may be reached through several network
        instances, and two ranges under one name may then legitimately overlap.
      type: object
      properties:
        dnn:
          type: string
        networkInstance:
          type: string
        dnai:
          type: string
        family:
          $ref: 'ETRI_NSM_ConfigurationServer.yaml#/components/schemas/IpFamily'
        ipIndex:
          type: integer
          format: int32
      required:
        - dnn
        - networkInstance
        - family

    IpSegmentClaim:
      description: |
        A claim on segments of one address space.

        count is how many segments this instance wants to hold in total, not how
        many to add: the call is idempotent under the uuid, so asking again with
        a larger count tops up and asking again with the same count returns what
        is already held. One segment is a hard ceiling on concurrent sessions,
        and an SMF should ask for another at a high-water mark rather than at
        exhaustion, because a rejected PDU session is UE-visible and an NSM round
        trip is slow next to a session establishment.
      type: object
      properties:
        key:
          $ref: '#/components/schemas/IpSegmentKey'
        count:
          type: integer
          format: int32
      required:
        - key

    IpSegmentGrant:
      description: |
        The segment prefixes this instance holds for one address space, and the
        length to hand out of them. A prefix is meaningful with no other
        configuration: it goes into a routing table, a Framed-Route or the UPF's
        route add verbatim, and it survives any edit to the space it came from.

        An empty prefix list is a real answer rather than an error. NSM allocates
        resources and does not manage NFs, so a space with no free segment now
        may have one later; the SMF installs the data network either way and
        asks again.
      type: object
      properties:
        key:
          $ref: '#/components/schemas/IpSegmentKey'
        prefixes:
          type: array
          items:
            type: string
        leases:
          description: |
            One lease per granted prefix, to be re-asserted on the renewal tick.
            Handed back rather than derived, for the reason on
            AmfRegistrationResponse.lease.
          type: array
          items:
            $ref: '#/components/schemas/Lease'
        allocationLength:
          type: integer
          format: int32
      required:
        - key
        - allocationLength

    IpSegmentRequest:
      description: UE IP segment claim
      type: object
      properties:
        uuid:
          type: string
        claims:
          type: array
          items:
            $ref: '#/components/schemas/IpSegmentClaim'
      required:
        - uuid

    IpSegmentResponse:
      description: |
        One grant per claim, in the order the claims were made, so a caller can
        match them without re-deriving the key.
      type: object
      properties:
        grants:
          type: array
          items:
            $ref: '#/components/schemas/IpSegmentGrant'
      required:
        - grants

    IpSegmentReleaseRequest:
      description: |
        Give back segments on a graceful stop. An empty key list releases
        everything this uuid holds, which is what an NF that is shutting down
        means. Releasing is an optimisation rather than a requirement: NSM
        reclaims what a holder that is gone left behind either way.
      type: object
      properties:
        uuid:
          type: string
        keys:
          type: array
          items:
            $ref: '#/components/schemas/IpSegmentKey'
      required:
        - uuid

    Lease:
      description: |
        One claim, named the same way whatever kind of thing it is: a space that
        knows how to enumerate its own candidates, and the value taken out of it.

        An AMF pointer is `amfpointer/<region>-<set>` and a decimal pointer; a UE
        IP segment is `ipseg/<networkInstance>/<dnai>/<family>/<ipIndex>` and a
        prefix. Nothing between the holder and the space needs to know which it
        is holding, which is what lets one renewal cover both.
      type: object
      properties:
        space:
          type: string
        value:
          type: string
      required:
        - space
        - value

    LeaseRenewalRequest:
      description: |
        The holder re-asserting what it believes it holds.

        **The holder says what it holds rather than asking what NSM thinks it
        holds**, and that is what makes the exchange recoverable rather than
        merely periodic. Whether NSM's leases survive its own restart is a
        property of where it keeps them, and even a store that keeps them can be
        behind; a renewal that only refreshed what NSM still remembered would
        confirm nothing and every live NF would be left using a resource NSM had
        forgotten. Asserted this way, the first renewal after a restart hands the
        table back - each holder re-acquires exactly what it already has, because
        nothing else has taken it yet.

        That is why this shape does not change with the storage underneath it:
        the holder is authoritative about what it holds either way.
      type: object
      properties:
        uuid:
          type: string
        leases:
          type: array
          items:
            $ref: '#/components/schemas/Lease'
      required:
        - uuid

    LeaseRenewalResponse:
      description: |
        What the holder may keep, and what it may not.
      type: object
      properties:
        confirmed:
          description: |
            The leases this holder still has, with their expiry pushed out. A
            value NSM had forgotten but nobody else had taken comes back here:
            re-acquiring what the holder demonstrably still has is the whole
            point of it asserting.
          type: array
          items:
            $ref: '#/components/schemas/Lease'
        lost:
          description: |
            Leases this holder asserted that somebody else now holds. This is a
            fault rather than a state, and the only correct response to it is an
            alarm plus whatever stops the holder using the value: two live
            holders of one AMF pointer alias each other's GUTI space, and two of
            one IP segment hand the same address to two UEs.

            Empty in every ordinary run, and reachable in practice only after NSM
            has restarted and given a value away before its holder renewed.
          type: array
          items:
            $ref: '#/components/schemas/Lease'
        leaseSeconds:
          description: |
            How long the confirmed leases last from now, if nothing renews them.

            A duration rather than an instant, deliberately. An absolute expiry
            is only meaningful if the holder's clock and NSM's agree, and nothing
            in this deployment makes them; a duration is measured on the side
            that has to act on it. NSM holds the absolute time, because there it
            is the one clock that matters.

            The holder's renewal period must be several times shorter than this,
            so that a lease survives a few missed ticks.
          type: integer
          format: int32
      required:
        - leaseSeconds
